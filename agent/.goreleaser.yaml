# goreleaser v2 — binaries for Linux amd64/arm64 and Windows amd64.
version: 2
project_name: microesp-agent

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: microesp-agent
    main: ./cmd/microesp-agent
    binary: microesp-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: deploy/**/*
        dst: deploy

checksum:
  # A single SHA256SUMS for the agent and the firmware (release.yml leaves the firmware .bin
  # firmware into agent/.release-firmware before running goreleaser).
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: ./.release-firmware/*.bin

release:
  extra_files:
    - glob: ./.release-firmware/*.bin

changelog:
  use: git
  sort: asc
