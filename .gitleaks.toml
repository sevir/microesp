# gitleaks configuration for MicroESP (CI "secrets" job).
# Starts from the default rules and only excludes the test vectors
# of the cdc-v1 protocol: their keys and signatures are public and normative (used
# by the agent and firmware tests), not real secrets.
title = "MicroESP gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public cdc-v1 protocol test vectors and fake firmware test keys (including the TuyaLink vectors)"
paths = [
  '''^protocol/testdata/vectors\.json$''',
  '''^firmware/test/host/test_security\.c$''',
  '''^firmware/test/host/test_tylink\.c$''',
]
